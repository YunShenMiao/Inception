<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inception</title>

  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at center, #111, #000);
      color: white;
    }

    .container {
      text-align: center;
      perspective: 1000px;
      margin-top: 80px;
    }

    h1 {
      font-size: 5rem;
      letter-spacing: 10px;
      text-transform: uppercase;
      transform-style: preserve-3d;
      transition: transform 0.2s ease-out;
    }

    #view-readme-btn {
      margin-top: 40px;
      padding: 12px 25px;
      border: 1px solid white;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    #view-readme-btn:hover {
      background: white;
      color: black;
    }

    #readme-wrapper {
      position: relative;
      margin: 60px auto;
      max-width: 900px;
      padding: 30px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      text-align: left;
      line-height: 1.6;
      display: none;
    }

    #readme-wrapper h1, #readme-wrapper h2, #readme-wrapper h3 {
      margin-top: 20px;
    }

    #readme-wrapper code {
      background: rgba(255,255,255,0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }

    #readme-wrapper pre {
      background: rgba(0,0,0,0.6);
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
    }

    #close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      cursor: pointer;
      font-size: 1.5rem;
      font-weight: bold;
      color: #ccc;
    }

    #close-btn:hover {
      color: white;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 3rem;
      }

      #readme-wrapper {
        margin: 30px 15px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">INCEPTION</h1>
    <button id="view-readme-btn">View README</button>
  </div>

  <div id="readme-wrapper">
    <div id="close-btn">&times;</div>
    <div id="readme">Loading README...</div>
  </div>

  <script>
    const title = document.getElementById('title');
    const readmeWrapper = document.getElementById('readme-wrapper');
    const closeBtn = document.getElementById('close-btn');
    const viewBtn = document.getElementById('view-readme-btn');

    // Perspective animation for title
    document.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth / 2 - e.clientX) / 20;
      const y = (window.innerHeight / 2 - e.clientY) / 20;
      title.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
    });

    document.addEventListener('mouseleave', () => {
      title.style.transform = 'rotateY(0deg) rotateX(0deg)';
    });

    // Load README.md but keep hidden until button clicked
    let readmeLoaded = false;
    viewBtn.addEventListener('click', () => {
      if (!readmeLoaded) {
        fetch('README.md')
          .then(response => response.text())
          .then(text => {
            const html = marked.parse(text);
            const container = document.getElementById('readme');
            container.innerHTML = html;

            // Disable all links
            container.querySelectorAll('a').forEach(link => {
              const text = link.innerText;
              link.replaceWith(text);
            });

            readmeLoaded = true;
          })
          .catch(() => {
            document.getElementById('readme').innerText = 'Failed to load README.md';
          });
      }
      readmeWrapper.style.display = 'block';
    });

    // Close button functionality
    closeBtn.addEventListener('click', () => {
      readmeWrapper.style.display = 'none';
    });
  </script>
</body>
</html>
