services:
  mariadb_in:
    build: requirements/mariadb
    image: mariadb_in
    container_name: mariadb_in
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
#ports:
#  - ?
    networks:
      - inception
    restart: unless-stopped # / always ?
  wp:
    build: requirements/wordpress
    image: wordpress_in
    container_name: wordpress_in
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    depends_on:
      - mariadb_in
    volumes:
      - wp_data:/var/www/html
#ports:
# - 
    networks:
      - inception
    restart: unless-stopped 
  nginx:
    build: requirements/nginx
    image: nginx_in
    container_name: nginx_in
    depends_on:
      - wp
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wp_data:/var/www/html
    restart: unless-stopped 

networks:
  inception:
    driver: bridge
  # if not defined creates default network

secrets:
  db_password:
    file: ../secrets/mysql_pw
  db_root_password:
    file: ../secrets/mysql_root_pw


volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress